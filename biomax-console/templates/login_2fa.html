<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
<title>Verify · BioMax Console</title>
<style>
  :root {
    --bg: #0a0e17; --panel: #131a2b; --surface-2: #1a2338; --border: #232d45;
    --text: #eef1f7; --text-dim: #9aa4bd; --text-faint: #626e8c;
    --accent: #5b8cff; --accent-dim: #5b8cff26; --red: #ff6b7a; --red-dim: #ff6b7a1f;
    --radius: 12px; --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,.24), 0 20px 50px -20px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, #131a2b 0%, var(--bg) 60%); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); width: 100%; max-width: 360px; padding: 34px 30px; margin: 20px;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 26px; }
  .brand .emoji { font-size: 34px; filter: drop-shadow(0 0 16px var(--accent-dim)); }
  .brand .title { font-weight: 700; font-size: 17px; letter-spacing: -.2px; }
  .brand .sub { color: var(--text-faint); font-size: 12.5px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 11.5px; color: var(--text-dim); margin-bottom: 7px;
    text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
  }
  .field input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 11px 14px; border-radius: var(--radius-sm); font-size: 22px; font-family: ui-monospace, monospace;
    text-align: center; letter-spacing: 6px; transition: border-color .12s ease;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .btn-primary {
    width: 100%; background: var(--accent); color: white; border: none; padding: 12px 24px;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; font-weight: 600;
    margin-top: 6px; transition: filter .12s ease, transform .06s ease;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: scale(.98); }
  .alert {
    padding: 11px 14px; border-radius: var(--radius-sm); margin-bottom: 18px; font-size: 13px;
    background: var(--red-dim); border: 1px solid #ff6b7a38; color: var(--red);
  }
  .back-link { display: block; text-align: center; margin-top: 18px; color: var(--text-faint); font-size: 12.5px; text-decoration: none; }
  .back-link:hover { color: var(--text-dim); }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <span class="emoji">📟</span>
    <div class="title">Two-Factor Verification</div>
    <div class="sub">Enter the 6-digit code from your authenticator app</div>
  </div>
  {% if error %}
  <div class="alert">⚠️ {{ error }}</div>
  {% endif %}
  <form method="post">
    <div class="field">
      <label>Code</label>
      <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autofocus required autocomplete="one-time-code">
    </div>
    <button type="submit" class="btn-primary">Verify</button>
  </form>
  <a href="/logout" class="back-link">← Back to login</a>
</div>
</body>
</html>
